<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stake Mine</title>
    <link
      rel="icon"
      href="https://toppng.com/uploads/preview/dollar-png-icon-dollar-ico-11563184791mhpavffw5e.png"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/base/scrollbar.css,npm/daisyui@5/base/svg.css,npm/daisyui@5/base/rootscrollgutter.css,npm/daisyui@5/base/rootcolor.css,npm/daisyui@5/base/properties.css,npm/daisyui@5/base/rootscrolllock.css,npm/daisyui@5/base/reset.css,npm/daisyui@5/components/input.css,npm/daisyui@5/components/menu.css,npm/daisyui@5/components/toggle.css,npm/daisyui@5/components/checkbox.css,npm/daisyui@5/components/button.css,npm/daisyui@5/components/select.css,npm/daisyui@5/theme/light.css"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Underdog&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="navbar">
      <div class="logo"><h1>STAKE</h1></div>
      <div class="money">
        <div class="wallet-money">100</div>
        <div class="wallet-div"><button id="wallet-btn">Wallet</button></div>
      </div>
    </div>
    <div class="main">
      <div class="dashboard">
        <div class="bet">
          <span>Bet Amount<br /></span>
          <input
            type="number"
            class="input validator amount"
            required
            placeholder="0"
            min="1"
            max="100"
            title="Enter a valid amount"
          />
          <p class="validator-hint">Enter a valid amount</p>
        </div>
        <div class="mines">
          <span>Mines<br /></span>
          <input
            type="number"
            class="input validator mineNum"
            required
            placeholder="Number of mines"
            min="1"
            max="24"
            title="Must be between be 1 to 24"
          />
          <p class="validator-hint">Must be between 1 to 24</p>
        </div>
        <div class="bet-button">
          <button id="bet-btn" disabled>BET</button>
        </div>
      </div>
      <div class="game-board">
        <div class="score">
          <div><h1 class="txt-1">Let's Play The</h1></div>
          <div><h1 class="curr-score txt-2">GAME !</h1></div>
        </div>
        <div class="board"></div>
        <div class="withdraw">
          <button id="withdraw-btn" class="hide" disabled>WITHDRAW</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    <script type="module" src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </body>
</html>
